<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome AI Assistant</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="icon">🤖</span>
                <h1>AI Assistant</h1>
            </div>
            <div class="header-actions">
                <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
                <button id="historyBtn" class="icon-btn" title="History">📝</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Question Input -->
            <div class="input-section">
                <div class="input-group">
                    <textarea 
                        id="questionInput" 
                        placeholder="Ask me anything about this page..."
                        rows="3"
                    ></textarea>
                    <div class="input-actions">
                        <button id="voiceBtn" class="voice-btn" title="Voice Input (Ctrl+Shift+V)">🎤 Voice</button>
                        <button id="askBtn" class="ask-btn" title="Ask AI (Ctrl+Enter)">Ask AI</button>
                    </div>
                </div>
            </div>

            <!-- Loading Indicator -->
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <span>Processing...</span>
            </div>

            <!-- Response Section -->
            <div id="responseContent" class="response-content" style="display: none;"></div>

            <!-- History Panel -->
            <div id="historyList" class="history-panel" style="display: none;">
                <h3>Recent Questions</h3>
                <div class="history-items"></div>
            </div>

            <!-- Settings Panel -->
            <div id="settingsPanel" class="settings-panel" style="display: none;">
                <h3>Settings</h3>
                <!-- Settings content will be populated by JavaScript -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-actions">
                <button id="clearBtn" class="clear-btn">Clear</button>
            </div>
            <div class="footer-info">
                <span class="status" id="status">Ready</span>
            </div>
        </footer>

        <!-- Notification -->
        <div id="notification" class="notification" style="display: none;"></div>
    </div>

    <!-- Scripts -->
    <script type="module" src="src/popup.js"></script>
</body>
</html>
